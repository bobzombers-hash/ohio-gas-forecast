name: Update forecast and publish site

on:
  schedule:
    - cron: "17 14 * * *"   # daily 14:17 UTC (~10:17 AM EDT / 9:17 AM EST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Refresh data, forecast all metros, build dashboard
        env:
          MPLBACKEND: Agg
          TZ: America/New_York
        run: python forecast.py --all

      - name: Commit refreshed data (metro history accumulates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/aaa_metro_history.csv data/aaa_latest.json data/*.xls
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html
          cp output/*.png _site/ 2>/dev/null || true
          cp output/results.json _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
